<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP2 · 三维层级场景：太阳系</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #05060c;
    color: #dfe3ee;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  #glCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  #glCanvas:active { cursor: grabbing; }

  /* ---------- 左上角标题 ---------- */
  #title {
    position: fixed; left: 22px; top: 18px;
    pointer-events: none;
    text-shadow: 0 2px 18px rgba(0,0,0,0.75);
  }
  #title h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  #title p {
    margin: 5px 0 0;
    font-size: 12px;
    color: #93a0b8;
    letter-spacing: 0.02em;
  }

  /* ---------- 右侧控制面板 ---------- */
  #panel {
    position: fixed; top: 16px; right: 16px;
    width: 272px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    padding: 16px 18px 14px;
    border-radius: 14px;
    background: linear-gradient(160deg, rgba(20,24,38,0.92), rgba(12,14,24,0.9));
    border: 1px solid rgba(140,165,220,0.16);
    box-shadow: 0 18px 48px rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
    user-select: none;
  }
  #panel h2 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 600;
    color: #cfd8ee;
    letter-spacing: 0.08em;
  }

  .group { margin-bottom: 13px; }
  .label-row {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 12px; color: #9aa7c0;
    margin-bottom: 6px;
  }
  .label-row .val {
    color: #eaf0ff;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px;
    border-radius: 2px;
    background: rgba(136,158,205,0.3);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #7fa2ff;
    border: 2px solid rgba(15,18,30,0.9);
    box-shadow: 0 0 10px rgba(127,162,255,0.65);
  }

  .check {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: #b8c3d8;
    margin: 7px 0; cursor: pointer;
  }
  .check input { accent-color: #7fa2ff; cursor: pointer; }

  .state-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: #b8c3d8;
    margin-bottom: 9px;
  }
  #projState { color: #ffcf7a; font-weight: 600; }

  .btn-row { display: flex; gap: 8px; }
  button {
    flex: 1;
    padding: 7px 0;
    font-size: 12.5px;
    font-family: inherit;
    color: #e6edff;
    background: rgba(58,82,140,0.55);
    border: 1px solid rgba(126,155,220,0.45);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: rgba(78,108,175,0.7); border-color: rgba(150,180,245,0.75); }

  .hint {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(140,165,220,0.13);
    font-size: 11px;
    line-height: 1.75;
    color: #7f8ba3;
  }
  .hint b { color: #aab6d0; font-weight: 600; }

  /* ---------- 底部提示 ---------- */
  #footer {
    position: fixed; left: 22px; bottom: 16px;
    font-size: 11.5px;
    color: #6d7891;
    letter-spacing: 0.02em;
    pointer-events: none;
    text-shadow: 0 1px 10px rgba(0,0,0,0.8);
  }
  #footer b { color: #98a5c2; }

  @media (max-width: 720px) {
    #panel { width: 232px; padding: 12px 14px; }
    #title { left: 14px; top: 12px; }
    #title h1 { font-size: 16px; }
    #footer { display: none; }
  }
</style>
</head>
<body>

<canvas id="glCanvas" aria-label="太阳系三维层级场景"></canvas>

<div id="title">
  <h1>三维层级场景 · 太阳系</h1>
  <p>太阳 — 地球 — 月球 三级变换嵌套 · 8 行星 / 土星环 / 小行星带</p>
</div>

<aside id="panel">
  <h2>控制面板</h2>

  <div class="group">
    <div class="label-row"><span>公转速度倍率</span><span class="val" id="orbitSpeedVal">1.0</span></div>
    <input type="range" id="orbitSpeed" min="0" max="8" step="0.1" value="1">
  </div>

  <div class="group">
    <div class="label-row"><span>自转速度倍率</span><span class="val" id="spinSpeedVal">1.0</span></div>
    <input type="range" id="spinSpeed" min="0" max="8" step="0.1" value="1">
  </div>

  <div class="group">
    <div class="label-row"><span>地球自转轴倾角（°）</span><span class="val" id="earthTiltVal">23.5</span></div>
    <input type="range" id="earthTilt" min="0" max="90" step="0.5" value="23.5">
  </div>

  <div class="group">
    <div class="label-row"><span>月球轨道面倾角（°）</span><span class="val" id="moonInclinationVal">5.1</span></div>
    <input type="range" id="moonInclination" min="0" max="30" step="0.1" value="5.1">
  </div>

  <div class="group">
    <label class="check"><input type="checkbox" id="showOrbits" checked> 显示轨道线</label>
    <label class="check"><input type="checkbox" id="showBelt" checked> 显示小行星带</label>
  </div>

  <div class="group">
    <div class="state-row"><span>当前投影</span><span id="projState">透视</span></div>
    <div class="btn-row">
      <button id="projBtn">切换投影</button>
      <button id="tourBtn">暂停漫游</button>
    </div>
  </div>

  <div class="hint">
    <b>O</b> 切换透视 / 正交投影　<b>空格</b> 暂停 / 继续漫游　<b>T</b> 重播漫游<br>
    鼠标：<b>左键拖动</b> 虚拟轨迹球（自动接管漫游）　<b>滚轮</b> 缩放
  </div>
</aside>

<div id="footer">左键拖动可随时接管相机 · 滚轮缩放 · O / 空格 / T 快捷键</div>

<!-- 教材风格工具库 -->
<script src="Common/webgl-utils.js"></script>
<script src="Common/MV.js"></script>
<script src="Common/initShaders.js"></script>

<!-- 业务模块：配置 / 几何 / 纹理 / 层级 / 相机 / 着色器 / 渲染 / UI / 输入 / 入口 -->
<script src="js/config.js"></script>
<script src="js/geometry.js"></script>
<script src="js/textures.js"></script>
<script src="js/hierarchy.js"></script>
<script src="js/camera.js"></script>
<script src="js/shaders.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>

</body>
</html>
